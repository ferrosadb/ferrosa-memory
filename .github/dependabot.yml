version: 2
updates:
  # SHA-pinned third-party GitHub Actions: dependabot resolves new versions
  # to fresh SHA pins and opens PRs weekly. Without this the pins decay into
  # unmaintained "frozen at vX.Y.Z" forever — which is its own supply-chain
  # risk (CVE in vX.Y.Z stays in our pin).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    groups:
      # Bundle minor/patch updates so we get one PR per week, not 8.
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Cargo: keep Rust deps current to surface CVEs early.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
