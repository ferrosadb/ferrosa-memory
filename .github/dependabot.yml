version: 2
updates:
  # SHA-pinned third-party GitHub Actions: dependabot resolves new versions
  # to fresh SHA pins and opens PRs weekly. Without this the pins decay into
  # unmaintained "frozen at vX.Y.Z" forever — which is its own supply-chain
  # risk (CVE in vX.Y.Z stays in our pin).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    groups:
      # Bundle minor/patch updates so we get one PR per week, not 8.
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Cargo: keep Rust deps current to surface CVEs early.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # RustCrypto next-generation jump (aead 0.6 / digest 0.11 / rand_core 0.9).
      # These majors can't be merged individually: aes-gcm / chacha20poly1305 only
      # support aead 0.6 in their 0.11.0-rc releases, and release-candidate crypto
      # must not enter the security-critical MaaS pack layer (pack_crypto.rs).
      # Closed as unmergeable: #94 (rand), #95 (hkdf), #96 (aead). Do this as ONE
      # coordinated upgrade once aes-gcm 0.11 + chacha20poly1305 0.11 + hkdf 0.13
      # ship stable, then remove this ignore. Minor/patch still flow via
      # cargo-minor-patch above.
      - dependency-name: "aead"
        update-types: ["version-update:semver-major"]
      - dependency-name: "aes-gcm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "chacha20poly1305"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hkdf"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]
      # webrtc 0.20 is not a version bump, it is a different library: a thin
      # async layer over a Sans-I/O `rtc` core, with PeerConnectionBuilder in
      # place of APIBuilder and a PeerConnectionEventHandler trait in place of
      # every on_*() callback. webrtc::api, webrtc::interceptor and
      # webrtc::ice_transport no longer exist at all.
      #
      # Porting is real work across ~3200 lines of control_session.rs,
      # peer_session.rs and peer_transport_webrtc.rs, and it rewrites the event
      # model of the P2P transport rather than adjusting call sites. Left to
      # dependabot it reappears weekly as a PR that can never go green (#209),
      # which teaches everyone to ignore a red badge on dependency PRs — the
      # one place a red badge matters most.
      #
      # Same treatment as the RustCrypto jump above: closed as unmergeable,
      # tracked as deliberate work, ignore removed when that lands.
      - dependency-name: "webrtc"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
