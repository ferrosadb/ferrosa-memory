name: Actions Pin Guard

# Fails the PR if any third-party GitHub Action `uses:` line is not pinned
# to a 40-char commit SHA (or explicitly allowlisted in
# .github/actions-allowlist with a documented justification).
#
# This is the supply-chain regression gate for P0-12.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required check must also report on the merge-queue branch.
  merge_group:

permissions:
  contents: read

jobs:
  guard:
    name: Verify SHA pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run guard
        run: bash .github/scripts/check-actions-pinned.sh
