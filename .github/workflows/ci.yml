name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run on the merge-queue branch so required checks (incl. "CI Pass") report
  # there. Without this, the merge queue waits forever for checks that never run
  # on the temporary gh-readonly-queue/* branch.
  merge_group:

env:
  CARGO_TERM_COLOR: always
  # NOTE: coverage instrumentation (`-Cinstrument-coverage`) is intentionally
  # NOT set workflow-wide. It forces every compile to be instrumented, which
  # (a) slows fmt-lint/build/docs/integration that don't need coverage and
  # (b) produces a different artifact fingerprint, defeating cache sharing.
  # It is scoped to the `test-coverage` job only (12-factor: build artifacts
  # once, reuse them — instrumented builds are a separate concern).

jobs:
  # Stage 1: Format + Lint
  fmt-lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          toolchain: "1.98.0"   # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Shared (non-instrumented) dependency cache, reused by build/docs/
          # integration. Collapsing the formerly per-job caches into one key
          # avoids blowing the 10GB repo cache limit (which evicted caches and
          # forced cold recompiles) and warms deps once for every consumer.
          shared-key: ws-noinstrument
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # MAAS-T-36: the P2P transport is feature-gated, so the default matrix
      # never compiles it — a broken locked dep (e.g. the webrtc 0.17.2 /
      # webrtc-sctp mismatch) would land silently. Keep the feature honest.
      - name: Clippy (webrtc-transport feature)
        run: cargo clippy -p ferrosa-memory-sync --features webrtc-transport --all-targets -- -D warnings
      # P0-11/W-01: no hardcoded loopback CQL addresses in non-test source.
      # Uses an awk-based scanner that strips #[cfg(test)] modules so the
      # tests that VERIFY the W-01 validator (which must literally use
      # "localhost:19042" as a fixture) don't trip the rule.
      - name: No loopback CQL addresses in production source (p0-11)
        run: ./.github/scripts/check-no-prod-loopback.sh
      # The workspace version must agree with the latest released tag, and the
      # commits since it must imply a bump somebody can see.
      #
      # promote-release syncs main to the tag it just cut via a required PR.
      # This gate remains defense in depth: on 2026-08-17 an older best-effort
      # workflow swallowed `gh pr create` failure and main sat at 0.23.0 behind
      # tag v0.27.0 for five days and twenty-one commits.
      #
      # Binaries self-report the Cargo version, so that drift ships binaries
      # announcing one version under a tag that says another, and every
      # downstream update check compares the two.
      #
      # fetch-depth 0 on this step's own fetch: the default checkout has no
      # tags, and a tag-less checkout would make this check pass by finding
      # nothing to disagree with.
      - name: Fetch tags for the version check
        run: git fetch --tags --quiet
      - name: Workspace version is in step with the latest release tag
        run: ./.github/scripts/check-version-sync.sh

  # Stage 1b: Dependency advisories
  advisories:
    name: Dependency Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          toolchain: "1.98.0"   # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Check advisories + licenses + bans + sources
        run: cargo deny check

  # Stage 2: Build + Typecheck
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: fmt-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          toolchain: "1.98.0"   # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ws-noinstrument
      - name: Build workspace
        run: cargo build --workspace --all-targets
      # 12-factor "build once, run many": compile every test binary here and
      # ship them as an archive. The integration job RUNS them from the archive
      # instead of recompiling the workspace (~14-min compile eliminated there).
      # The `--all-targets` build above already compiled these test binaries, so
      # `nextest archive` is cache-warm and just packages them.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: nextest
      - name: Archive test binaries (built once, run in integration)
        run: cargo nextest archive --workspace --archive-file nextest-archive.tar.zst
      - name: Upload nextest archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1

  # Stage 3: Tests + Coverage
  test-coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: build
    # Coverage instrumentation is scoped here (it was formerly workflow-wide).
    # cargo-llvm-cov manages the profile env itself; this matches the prior
    # behaviour for this job while leaving every other job un-instrumented.
    env:
      RUSTFLAGS: "-Cinstrument-coverage"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          toolchain: "1.98.0"   # keep in sync with rust-toolchain.toml
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-llvm-cov
      - name: Run tests with coverage
        run: |
          # Exclude: test files, mock storage, infrastructure needing live services
          # (CQL storage, MCP/batch binaries, HTTP server, graph/embedding clients)
          EXCL='(tests/|test_|_test\.rs|mock|cql_storage\.rs|main\.rs|http\.rs|graph\.rs|embedding\.rs)'
          # Skip integration tests entirely from the coverage pass — they
          # panic-loud on missing FERROSA_TEST_CQL_PORT (per fmem CLAUDE.md
          # policy: tests requiring a cluster must `panic!` rather than
          # `#[ignore]`). The integration job below exercises them with a
          # real cluster. `--lib --bins` covers all unit-test code without
          # touching `tests/*.rs`.
          cargo llvm-cov --workspace --lib --bins \
            --lcov --output-path lcov.info \
            --ignore-filename-regex "$EXCL"
      - name: Coverage summary
        run: |
          EXCL='(tests/|test_|_test\.rs|mock|cql_storage\.rs|main\.rs|http\.rs|graph\.rs|embedding\.rs)'
          cargo llvm-cov --workspace \
            --ignore-filename-regex "$EXCL" \
            --no-run 2>/dev/null || true
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: lcov.info
      - name: Check coverage threshold (80% line)
        run: |
          EXCL='(tests/|test_|_test\.rs|mock|cql_storage\.rs|main\.rs|http\.rs|graph\.rs|embedding\.rs)'
          TOTAL=$(cargo llvm-cov --workspace \
            --ignore-filename-regex "$EXCL" \
            --no-run --json 2>/dev/null | \
            jq -r '.data[0].totals.lines.percent // 0')
          echo "Total line coverage: ${TOTAL}%"
          # Gate: fail if below 80%
          if [ "$(echo "$TOTAL < 80" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
            echo "::error::Coverage ${TOTAL}% is below 80% threshold"
            exit 1
          fi

  # Stage 3b: MCP draft conformance
  mcp-conformance:
    name: MCP Draft Conformance
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          toolchain: "1.98.0"   # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ws-noinstrument
      - name: Run MCP draft conformance tests
        run: |
          cargo test -p ferrosa-memory-core --lib modern_
          cargo test -p ferrosa-memory-core --lib modern_resources
          cargo test -p ferrosa-memory-core --lib modern_workspace_resource
          cargo test -p ferrosa-memory-core --lib modern_mcp_subscriptions
          cargo test -p ferrosa-memory-core --lib modern_mcp_prompts
          cargo test -p ferrosa-memory-core --lib rejects_non_loopback_origin_that_does_not_match_host
          cargo test -p ferrosa-memory-core --lib get_or_delete_mcp_returns_method_not_allowed
          cargo test -p ferrosa-memory-core --lib tool_definitions_catalog_snapshot
          cargo test -p ferrosa-memory-eval --lib http_client
          cargo test -p ferrosa-memory-core --features subscription-fixture,long-running-operation-fixture --lib draft_profile_end_to_end_smoke

  # Stage 4: Complexity analysis
  complexity:
    name: Complexity Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rust-code-analysis
        run: |
          cargo install rust-code-analysis-cli 2>/dev/null || \
          echo "::warning::rust-code-analysis-cli not available, using fallback"
      - name: Analyze complexity
        run: |
          if command -v rust-code-analysis-cli &>/dev/null; then
            echo "## Complexity Report" > complexity-report.md
            echo "" >> complexity-report.md
            for f in $(find crates -name '*.rs' -not -path '*/target/*'); do
              result=$(rust-code-analysis-cli -m -p "$f" 2>/dev/null || echo "")
              if [ -n "$result" ]; then
                echo "### $f" >> complexity-report.md
                echo '```' >> complexity-report.md
                echo "$result" >> complexity-report.md
                echo '```' >> complexity-report.md
              fi
            done
          else
            echo "## Complexity Report (fallback)" > complexity-report.md
            echo "" >> complexity-report.md
            echo "Using line-count heuristic (install rust-code-analysis-cli for proper CC)." >> complexity-report.md
            echo "" >> complexity-report.md
            # Fallback: flag functions over 60 lines (Rule 4: Short Functions)
            for f in $(find crates -name '*.rs' -not -path '*/target/*'); do
              awk '/^[[:space:]]*(pub )?(async )?fn / { fname=$0; start=NR }
                   start && /^[[:space:]]*\}/ { len=NR-start; if(len>60) printf "WARN: %s:%d %s (%d lines)\n", FILENAME, start, fname, len; start=0 }' "$f" \
                >> complexity-report.md 2>/dev/null
            done
          fi
          cat complexity-report.md
      - name: Upload complexity report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: complexity-report
          path: complexity-report.md

  # Stage 5: Documentation generation
  docs:
    name: Generate Docs
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          toolchain: "1.98.0"   # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ws-noinstrument
      - name: Build documentation
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdoc
          path: target/doc

  # Stage 6: Repo-level blueprint harness smoke
  python-harness:
    name: Blueprint Harness Smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install harness dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Verify traceability coverage
        run: python scripts/coverage_gap.py specs/test-specification.md crates/ferrosa-memory-core/src crates/ferrosa-memory-core/tests tests
      - name: Run repo-level pytest harness
        run: |
          pytest tests/integration -v
          pytest tests/system -v
          pytest tests/duration/test_duration_specs.py -v

  # Stage 7: Cluster-backed integration tests (--ignored, Docker)
  # Cross-repo dependency: PULLS ferrosa's prebuilt test-node image from GHCR
  # (never compiles ferrosa here). Test binaries come from the build job's
  # nextest archive (no workspace recompile). Tests hardcode ports 19042-19044;
  # CI runners are isolated so this is safe.
  integration:
    name: Cluster integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull the prebuilt ghcr.io/ferrosadb/ferrosa-test-node image
    # Runs on PRs, on main, AND on the merge-queue branch so the queue verifies
    # cluster integration on the actual merged result (catches cross-PR conflicts
    # that only surface when stacked PRs are combined).
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.ref == 'refs/heads/main'
    needs: build
    # The cluster job routinely completes its tests near the old 45m cap;
    # leave teardown/log collection headroom so a passing suite is not marked cancelled.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          toolchain: "1.98.0"   # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ws-noinstrument
          cache-on-failure: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: nextest
      - name: Download prebuilt test-binary archive (from the build job)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-archive
      - name: Provision ferrosa node image (prebuilt from GHCR — never compiled here)
        # ferrosa-memory NEVER compiles ferrosa. ferrosa CI publishes a prebuilt
        # binary image (ghcr.io/ferrosadb/ferrosa-test-node:<sha>, built by
        # COPYing release binaries — not a source compile) for every main push
        # AND every ferrosa PR-branch head. We pull the right one and tag it
        # locally as `ferrosa-memory-node` (the name both compose files use).
        #
        # SHA resolution:
        #   - cross-repo PR (a same-named ferrosa branch exists): that branch HEAD
        #   - otherwise: ferrosa main HEAD
        #
        # If the image for the resolved SHA is unavailable we FAIL LOUD instead of
        # building from source. A source build would silently mask a missing
        # upstream publish and reintroduce the ~24-min compile this repo forbids
        # (see CLAUDE.md: ferrosa-memory must only consume prebuilt artifacts).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/ferrosadb/ferrosa-test-node"
          LOCAL_TAG="ferrosa-memory-node"
          FERROSA_REMOTE="https://github.com/ferrosadb/ferrosa.git"
          retry() { local n=0; until "$@"; do n=$((n + 1)); [ "$n" -ge 5 ] && return 1; echo "retry ${n}/5 in 5s..."; sleep 5; done; }

          # Resolve the ferrosa commit whose prebuilt image we need.
          SHA=""; SRC=""
          for c in "${GITHUB_HEAD_REF:-}" "${GITHUB_REF_NAME:-}"; do
            [ -n "$c" ] || continue
            # `main` is resolved below as the default, not as a paired *feature*
            # branch — skip it so pushes to main and the merge queue pull main's image.
            [ "$c" = "main" ] && continue
            ref="$(git ls-remote --heads "$FERROSA_REMOTE" "$c" 2>/dev/null || true)"
            if [ -n "$ref" ]; then
              SHA="$(echo "$ref" | awk 'NR==1{print $1}')"; SRC="paired ferrosa branch '$c'"; break
            fi
          done
          if [ -z "$SHA" ]; then
            SHA="$(gh api repos/ferrosadb/ferrosa/commits/main --jq '.sha')"; SRC="ferrosa main"
          fi
          echo "::notice::Resolved ferrosa image to ${IMAGE}:${SHA} (${SRC})"

          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ! retry docker pull "${IMAGE}:${SHA}"; then
            echo "::error::Prebuilt ferrosa image ${IMAGE}:${SHA} (${SRC}) is not available."
            echo "::error::ferrosa-memory does NOT compile ferrosa — it only consumes prebuilt"
            echo "::error::artifacts. Ensure ferrosa CI has published the test-node image for"
            echo "::error::${SHA} (push the branch / let its CI finish), then re-run this job."
            exit 1
          fi
          docker tag "${IMAGE}:${SHA}" "$LOCAL_TAG"
          echo "::notice::Using prebuilt ${IMAGE}:${SHA} — no ferrosa compile"
      - name: Pre-pull external images (retry Docker Hub flakes)
        # The cluster compose files pull rustfs/minio images from Docker Hub at
        # `compose up` time with no retry, so a transient registry timeout fails
        # the whole job — and this job gates the merge queue. Pre-pull them here
        # with exponential backoff; the later `compose up` steps then hit the
        # local image cache instead of the registry.
        run: |
          retry() {
            local n=0 max=5 delay=5
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge "$max" ]; then
                echo "::error::'$*' failed after ${max} attempts"
                return 1
              fi
              echo "attempt ${n}/${max} failed; retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          for img in rustfs/rustfs:latest minio/minio:latest minio/mc:latest; do
            retry docker pull "$img"
          done
      - name: Bring up 3-node cluster on ports 19042-19044
        run: |
          # Write a CI compose that maps 9042→19042 etc. so tests that hardcode
          # 127.0.0.1:19042-19044 connect correctly.
          cat > /tmp/docker-compose.memory-ci.yml <<'CEOF'
          services:
            rustfs:
              image: rustfs/rustfs:latest
              environment:
                RUSTFS_VOLUMES: /data/rustfs0
                RUSTFS_ADDRESS: "0.0.0.0:9000"
                RUSTFS_ACCESS_KEY: ferrosa-ci-access  # pragma: allowlist secret
                RUSTFS_SECRET_KEY: ferrosa-ci-secret-key  # pragma: allowlist secret
              healthcheck:
                test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
                interval: 5s
                timeout: 5s
                retries: 10
                start_period: 10s
            rustfs-init:
              image: minio/mc
              depends_on:
                rustfs:
                  condition: service_healthy
              entrypoint: >
                sh -c "mc alias set local http://rustfs:9000 ferrosa-ci-access ferrosa-ci-secret-key &&
                       mc mb local/ferrosa-test --ignore-existing &&
                       echo 'bucket ferrosa-test ready'"
              restart: "no"
            node1:
              image: ferrosa-memory-node
              depends_on:
                rustfs-init:
                  condition: service_completed_successfully
              ports:
                - "19042:9042"
                - "17474:7474"
                - "19090:9090"
              environment:
                FERROSA_HOST_ID: "11111111-1111-1111-1111-111111111111"
                FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
                FERROSA_INTERNODE_BROADCAST: "node1:7000"
                FERROSA_CQL_BIND: "0.0.0.0:9042"
                FERROSA_WEB_BIND: "0.0.0.0:9090"
                FERROSA_GRAPH_BIND: "0.0.0.0:7474"
                FERROSA_GRAPH_ENABLED: "true"
                FERROSA_CLUSTER_NAME: "ferrosa-memory-ci"
                FERROSA_DATA_DIR: "/var/lib/ferrosa"
                FERROSA_AUTH_DISABLED: "true"
                FERROSA_S3_ENDPOINT: "http://rustfs:9000"
                FERROSA_S3_BUCKET: "ferrosa-test"
                FERROSA_S3_ALLOW_HTTP: "true"
                FERROSA_S3_ACCESS_KEY_ID: "ferrosa-ci-access"
                FERROSA_S3_SECRET_ACCESS_KEY: "ferrosa-ci-secret-key"  # pragma: allowlist secret
              healthcheck:
                test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9042' || exit 1"]
                interval: 5s
                timeout: 5s
                retries: 30
                start_period: 20s
            node2:
              image: ferrosa-memory-node
              depends_on:
                # Start all Ferrosa nodes after the shared object-store
                # bootstrap. A TCP-open node1 is only a standalone/pair node,
                # not proof that a three-node Raft cluster has formed. Waiting
                # for it here serializes formation and can leave node2 as a
                # pair-mode secondary when node3 joins.
                rustfs-init:
                  condition: service_completed_successfully
              ports:
                - "19043:9042"
                - "19091:9090"
              environment:
                FERROSA_HOST_ID: "22222222-2222-2222-2222-222222222222"
                FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
                FERROSA_INTERNODE_BROADCAST: "node2:7000"
                FERROSA_SEED: "node1:7000"
                FERROSA_CQL_BIND: "0.0.0.0:9042"
                FERROSA_WEB_BIND: "0.0.0.0:9090"
                FERROSA_CLUSTER_NAME: "ferrosa-memory-ci"
                FERROSA_DATA_DIR: "/var/lib/ferrosa"
                FERROSA_AUTH_DISABLED: "true"
                FERROSA_S3_ENDPOINT: "http://rustfs:9000"
                FERROSA_S3_BUCKET: "ferrosa-test"
                FERROSA_S3_ALLOW_HTTP: "true"
                FERROSA_S3_ACCESS_KEY_ID: "ferrosa-ci-access"
                FERROSA_S3_SECRET_ACCESS_KEY: "ferrosa-ci-secret-key"  # pragma: allowlist secret
              healthcheck:
                test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9042' || exit 1"]
                interval: 5s
                timeout: 5s
                retries: 30
                start_period: 20s
            node3:
              image: ferrosa-memory-node
              depends_on:
                # Match the upstream cluster topology: all three nodes begin
                # discovery together after the shared dependency is ready.
                rustfs-init:
                  condition: service_completed_successfully
              ports:
                - "19044:9042"
                - "19092:9090"
              environment:
                FERROSA_HOST_ID: "33333333-3333-3333-3333-333333333333"
                FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
                FERROSA_INTERNODE_BROADCAST: "node3:7000"
                FERROSA_SEED: "node1:7000"
                FERROSA_CQL_BIND: "0.0.0.0:9042"
                FERROSA_WEB_BIND: "0.0.0.0:9090"
                FERROSA_CLUSTER_NAME: "ferrosa-memory-ci"
                FERROSA_DATA_DIR: "/var/lib/ferrosa"
                FERROSA_AUTH_DISABLED: "true"
                FERROSA_S3_ENDPOINT: "http://rustfs:9000"
                FERROSA_S3_BUCKET: "ferrosa-test"
                FERROSA_S3_ALLOW_HTTP: "true"
                FERROSA_S3_ACCESS_KEY_ID: "ferrosa-ci-access"
                FERROSA_S3_SECRET_ACCESS_KEY: "ferrosa-ci-secret-key"  # pragma: allowlist secret
              healthcheck:
                test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9042' || exit 1"]
                interval: 5s
                timeout: 5s
                retries: 30
                start_period: 20s
          CEOF
          python scripts/validate-ci-cluster-topology.py /tmp/docker-compose.memory-ci.yml
          docker compose -f /tmp/docker-compose.memory-ci.yml up -d
      - name: Wait for a formed 3-node cluster
        run: |
          for port in 19042 19043 19044; do
            echo "Waiting for CQL on port ${port}..."
            for i in $(seq 1 60); do
              if bash -c "</dev/tcp/127.0.0.1/${port}" 2>/dev/null; then
                echo "  port ${port} ready after ${i}s"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "::error::Port ${port} did not become ready within 60s"
                docker compose -f /tmp/docker-compose.memory-ci.yml logs 2>/dev/null | tail -100
                exit 1
              fi
              sleep 2
            done
          done

          # A listening CQL socket only proves that the process accepted TCP.
          # In the progressive topology it may still be standalone, pair, or
          # forming; scylla drivers then correctly reject a secondary during
          # their mandatory REGISTER handshake. Gate migrations on the actual
          # cluster state of every node instead.
          for port in 19090 19091 19092; do
            echo "Waiting for cluster mode on web port ${port}..."
            for i in $(seq 1 60); do
              status="$(curl --fail --silent --show-error \
                "http://127.0.0.1:${port}/api/cluster/status" 2>&1 || true)"
              if printf '%s' "$status" | grep -Eq '"mode"[[:space:]]*:[[:space:]]*"cluster"'; then
                echo "  web port ${port} reports cluster mode after ${i}s"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "::error::Node on web port ${port} did not reach cluster mode; last status: ${status}"
                docker compose -f /tmp/docker-compose.memory-ci.yml logs 2>/dev/null | tail -200
                exit 1
              fi
              sleep 2
            done
          done

          echo "Waiting for graph HTTP on port 17474..."
          for i in $(seq 1 60); do
            if bash -c "</dev/tcp/127.0.0.1/17474" 2>/dev/null; then
              echo "  graph HTTP TCP listener up after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Graph HTTP did not become ready within 60s"
              docker compose -f /tmp/docker-compose.memory-ci.yml logs 2>/dev/null | tail -100
              exit 1
            fi
            sleep 2
          done
      - name: Pre-build the migrate binary (keep the compile out of the DDL timeout)
        # Both `timeout 180s cargo run --bin migrate` calls below were timing
        # the COMPILE, not the DDL apply. This job does not share the earlier
        # `cargo build --workspace` step (different job), so `cargo run` built
        # migrate from scratch inside the timeout.
        #
        # Observed on run 31162617800 (and identically on main since
        # 2026-08-05, so this blocks every PR in the repo, not one branch):
        #   08:49:52  step starts, timeout 180s begins
        #   08:50:07  still compiling dependencies
        #   08:52:29  first DDL applied — 157s of the 180s already spent
        #   08:52:52  killed, exit 124, 36 of 53 DDL files applied
        # It was making steady progress when killed: not a hang, and not slow
        # DDL. The budget was simply consumed before the work started.
        #
        # Building here leaves the timeout bounding only the DDL apply, which
        # is what it was meant to bound. The `cargo run` calls stay as-is and
        # become near-instant freshness checks.
        run: cargo build --bin migrate

      - name: Apply DDL + wait for schema propagation across all 3 nodes
        # p1-37 (ferrosa) lifted the scylla 0.15 driver-compat block, so
        # the migrate binary can now apply DDL against ferrosa via raw
        # `session.query_unpaged`. Verified locally: all 28 fmem DDL
        # files apply end-to-end ("migrations completed").
        run: |
          timeout 180s cargo run --bin migrate -- \
            --contact-points 127.0.0.1:19042 \
            --keyspace agent_memory \
            --ddl-dir ddl

          # Propagation barrier: SELECT-only probe against each peer until the
          # agent_memory keyspace is visible in system_schema.keyspaces. We
          # cannot re-run the migrate DDL here — the scylla driver's auto
          # schema-agreement metadata fetch (triggered by any DDL once schema
          # exists) currently fails against ferrosa's system_schema.views
          # column shape. The --probe-only path issues a single SELECT only,
          # which sidesteps that path.
          for port in 19043 19044; do
            echo "Waiting for keyspace propagation on port ${port}..."
            for i in $(seq 1 30); do
              # Keep each probe bounded. A wedged peer must fail this attempt
              # and surface diagnostics instead of hanging the cluster job.
              if timeout 20s cargo run --quiet --bin migrate -- \
                  --contact-points 127.0.0.1:${port} \
                  --keyspace agent_memory \
                  --probe-only >/dev/null 2>&1; then
                echo "  port ${port} sees agent_memory after ${i} attempts"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "::error::Schema not visible on port ${port} within bounded retries"
                docker compose -f /tmp/docker-compose.memory-ci.yml logs 2>/dev/null | tail -100
                exit 1
              fi
              sleep 2
            done
          done

          # The graph engine's TCP listener comes up well before the engine
          # can answer queries — /graph/health passes ~1s in, but /graph/query
          # for a real keyspace takes longer (schema discovery, prepared-
          # statement setup, etc.). Probe the actual query endpoint with a
          # trivial RETURN, so cluster-gated graph_live tests don't race the
          # engine's warm-up.
          #
          # Each attempt prints its outcome (HTTP status or curl error) so a
          # silent stall is impossible — if the engine is hung we see *why*
          # in the workflow log, not a 17-minute blank screen.
          ./.github/scripts/graph-query-probe.sh \
            --label "main cluster /graph/query (read)" \
            --url   http://127.0.0.1:17474/graph/query \
            --query 'RETURN 1 AS x' \
            --keyspace agent_memory \
            --attempts 30 \
            --curl-timeout 5 \
            --sleep 2 \
            --logs-cmd 'docker compose -f /tmp/docker-compose.memory-ci.yml logs'

          # Read warms up fast; write path (MERGE + edge SET) often takes
          # longer on first use — index/buffer init, write-quorum
          # negotiation, S3 first-write, etc. The 10s reqwest timeout in
          # GraphClient bites here. Mirror the exact shape the failing
          # test uses (public_graph_write_round_trip_for_co_occurs_edges):
          # two Entity MERGEs + a CO_OCCURS_WITH edge MERGE + SET. Use
          # fresh UUIDs per attempt so each iteration actually exercises
          # the create-write path rather than a no-op match.
          ./.github/scripts/graph-write-probe.sh \
            --label "main cluster /graph/query (write)" \
            --url   http://127.0.0.1:17474/graph/query \
            --keyspace agent_memory \
            --attempts 30 \
            --curl-timeout 10 \
            --sleep 3 \
            --logs-cmd 'docker compose -f /tmp/docker-compose.memory-ci.yml logs'
      - name: Bring up isolated test cluster (port 19542)
        # `crates/ferrosa-memory-core/tests/migration_drift.rs::t03_*`
        # exercises the v30 → v31 keyspace-upgrade path and needs a
        # cluster it can DROP+CREATE keyspaces on without colliding
        # with the main cluster the rest of the integration tests
        # share. `docker-compose.test.yml` is the upstream-maintained
        # +500-port-offset compose for exactly this — bring it up
        # alongside the main cluster.
        run: |
          # The compose file references `image: ferrosa-memory-node`, which the
          # "Provision ferrosa node image" step already tagged from the prebuilt
          # GHCR image. No rebuild needed here.
          # Compose uses ~/data/ferrosa-memory-test/{minio,node1,..}
          # — make sure the dirs exist on the runner.
          mkdir -p \
            ~/data/ferrosa-memory-test/minio \
            ~/data/ferrosa-memory-test/node1 \
            ~/data/ferrosa-memory-test/node2 \
            ~/data/ferrosa-memory-test/node3
          # CI brings up node1-test only (standalone). The 3-node test
          # compose's progressive bring-up (standalone → pair → cluster)
          # doesn't reliably reach write-quorum availability for the
          # graph engine's adjacency keyspace within the CI window
          # — graph writes timed out with CL=QUORUM received=0 even
          # at RF=1. The migration-drift + graph_live + ferrosa_bugs
          # suites only need a single-node cluster they can DROP+CREATE
          # keyspaces on; standalone node1-test satisfies that.
          docker compose -f docker-compose.test.yml up -d minio-test minio-test-init node1-test
          echo "Waiting for test cluster CQL on 19542..."
          for i in $(seq 1 60); do
            if bash -c "</dev/tcp/127.0.0.1/19542" 2>/dev/null; then
              echo "  test cluster CQL ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Test cluster did not become ready within 120s"
              docker compose -f docker-compose.test.yml logs 2>/dev/null | tail -100
              exit 1
            fi
            sleep 2
          done
          echo "Applying DDL to test cluster..."
          # Test cluster doesn't reliably reach full cluster-mode quorum
          # readiness within the migrate window — writes at CL=QUORUM with
          # the production RF=3 DDL fail with received=0/required=2 even
          # after schema is visible. The test cluster is ephemeral, so
          # drop to RF=1 (single replica per write) for the test keyspace.
          # This is exactly what --replication-factor was added for.
          timeout 180s cargo run --bin migrate -- \
            --contact-points 127.0.0.1:19542 \
            --keyspace agent_memory_test \
            --replication-factor 1 \
            --ddl-dir ddl

          # Warm up the test cluster's graph /graph/query endpoint, both
          # read and write. graph_live tests now target the test cluster
          # (FERROSA_TEST_GRAPH_URL=http://127.0.0.1:17974); without an
          # explicit write probe, public_graph_write_round_trip_for_co_occurs_edges
          # hits the graph engine before the write path is ready and
          # times out under the 10s reqwest limit. Same probe shape as
          # the main-cluster warmup above.
          ./.github/scripts/graph-query-probe.sh \
            --label "test cluster /graph/query (read)" \
            --url   http://127.0.0.1:17974/graph/query \
            --query 'RETURN 1 AS x' \
            --keyspace agent_memory_test \
            --attempts 30 \
            --curl-timeout 5 \
            --sleep 2 \
            --logs-cmd 'docker compose -f docker-compose.test.yml logs'

          ./.github/scripts/graph-write-probe.sh \
            --label "test cluster /graph/query (write)" \
            --url   http://127.0.0.1:17974/graph/query \
            --keyspace agent_memory_test \
            --attempts 30 \
            --curl-timeout 10 \
            --sleep 3 \
            --logs-cmd 'docker compose -f docker-compose.test.yml logs'

      - name: Build ferrosa-memory-mcp binary for eval tests
        # ferrosa-memory-eval's live tests spawn the MCP server via
        # McpClient::spawn(), which resolves the binary path at COMPILE time
        # from env!("CARGO_MANIFEST_DIR") → "$GITHUB_WORKSPACE/target/debug/
        # ferrosa-memory-mcp" (runner.rs). That path is identical in the build
        # and integration jobs (GH always checks out to /home/runner/work/<repo>/
        # <repo>), so the archived eval test finds this binary. Test binaries
        # come from the archive; this MCP *bin* is a runtime spawn target, not a
        # cargo test dependency, so it must be built explicitly here.
        run: cargo build -p ferrosa-memory-mcp
      - name: Require a clean fresh-keyspace migration run
        # Release gate: creates a unique keyspace and executes the exact
        # application startup runner through every registered migration. It
        # asserts every ledger row and derived schema postcondition, then an
        # idempotent second pass. Keep this explicit rather than relying on the
        # broad ignored suite, so the guarantee stays visible and merge-blocking.
        env:
          FERROSA_TEST_CONTAINERS: "1"
          FERROSA_TEST_CQL_HOST: "127.0.0.1"
          FERROSA_TEST_CQL_PORT: "19542"
          FERROSA_TEST_GRAPH_URL: "http://127.0.0.1:17974"
          FERROSA_TEST_KEYSPACE: "agent_memory_test"
          FERROSA_TEST_S3_ENDPOINT: "http://127.0.0.1:19500"
        run: |
          cargo nextest run \
            --archive-file nextest-archive.tar.zst \
            --workspace-remap . \
            --run-ignored ignored-only \
            --filterset 'package(ferrosa-memory-core) and binary(migration_drift) and test(t10_fresh_keyspace_applies_every_registered_migration)'
      - name: Run remaining ignored (cluster-gated) Rust tests
        env:
          FERROSA_TEST_CONTAINERS: "1"
          # Migration-drift tests run keyspace-recreate cycles against
          # the isolated test cluster brought up above.
          FERROSA_TEST_CQL_HOST: "127.0.0.1"
          FERROSA_TEST_CQL_PORT: "19542"
          FERROSA_TEST_GRAPH_URL: "http://127.0.0.1:17974"
          FERROSA_TEST_KEYSPACE: "agent_memory_test"
          FERROSA_TEST_S3_ENDPOINT: "http://127.0.0.1:19500"
        # Runs at full parallelism on purpose. The earlier flake here
        # (transient LOCAL_QUORUM write timeouts / KeepaliveTimeout / "pool is
        # broken" under the 2-vCPU runner) was NOT a CI-tuning problem — it was
        # a real ferrosa defect: blocking work ran on tokio async worker
        # threads (a per-write `statvfs` in the storage write-admission check,
        # synchronous point-read storage access, and synchronous `engine.write`
        # inside the raft apply path). Under load a worker would park in a
        # blocking syscall and starve Raft heartbeats / CQL handshakes. Fixed
        # upstream in ferrosa (commits 6ef9d313 / a6cf1ed5 / 57ba8ec3); this
        # job exercises the full concurrent load against the fixed engine so a
        # regression would surface here rather than being masked by serializing.
        #
        # 12-factor build-once: run the remaining test binaries compiled in
        # the `build` job from the downloaded nextest archive — NO workspace
        # recompile here. The dedicated fresh-keyspace migration release gate
        # above has already run; excluding it avoids duplicate expensive DDL.
        # `--workspace-remap .` points archived binaries at this checkout for
        # path-relative fixtures. `task_board_live` is deliberately absent:
        # it validates Forge's real task board (schema and data owned by a
        # different repository), not the disposable CI cluster. It remains
        # available for an explicit local `--test task_board_live -- --ignored`
        # run against that external board.
        run: |
          cargo nextest run \
            --archive-file nextest-archive.tar.zst \
            --workspace-remap . \
            --run-ignored ignored-only \
            --filterset 'not (package(ferrosa-memory-core) and binary(migration_drift) and test(t10_fresh_keyspace_applies_every_registered_migration)) and not (package(ferrosa-memory-sync) and binary(task_board_live))' \
            --no-fail-fast
      - name: Run system pytest suite against live cluster
        env:
          FERROSA_BASE_URL: "http://127.0.0.1:19090"
        run: |
          python -m pip install -r tests/requirements.txt
          pytest tests/system -v
      - name: Collect cluster logs on failure
        if: failure()
        run: |
          echo "=== main cluster ==="
          docker compose -f /tmp/docker-compose.memory-ci.yml logs --no-color 2>/dev/null | tail -200 || true
          echo "=== test cluster ==="
          docker compose -f docker-compose.test.yml logs --no-color 2>/dev/null | tail -200 || true
      - name: Tear down cluster
        if: always()
        run: |
          docker compose -f /tmp/docker-compose.memory-ci.yml down -v --remove-orphans 2>/dev/null || true
          docker compose -f docker-compose.test.yml down -v --remove-orphans 2>/dev/null || true

  # Final gate: all checks must pass
  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [fmt-lint, advisories, build, test-coverage, mcp-conformance, complexity, docs, python-harness, integration]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.fmt-lint.result }}" != "success" ] || \
             [ "${{ needs.advisories.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test-coverage.result }}" != "success" ] || \
             [ "${{ needs.mcp-conformance.result }}" != "success" ] || \
             [ "${{ needs.complexity.result }}" != "success" ] || \
             [ "${{ needs.docs.result }}" != "success" ] || \
             [ "${{ needs.python-harness.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ]; then
            echo "::error::One or more CI stages failed"
            exit 1
          fi
          echo "All CI stages passed"
