name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: >-
          Mark the GitHub release as a prerelease (the "nightly" channel).
          Stable releases are promoted separately via promote-release.yml.
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # ── Linux x86_64 (musl) ──────────────────────────────────────────────
  build-linux-x86_64:
    name: Build Linux x86_64 (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          toolchain: "1.98.0"   # keep in sync with rust-toolchain.toml
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Clippy
        run: cargo clippy --all-targets --target x86_64-unknown-linux-musl -- -D warnings

      - name: Build
        run: |
          cargo build --release --target x86_64-unknown-linux-musl -p ferrosa-memory-mcp
          cargo build --release --target x86_64-unknown-linux-musl -p fmem-cli
          # A hosted memory on linux is the case where remote control matters
          # most, so the listener ships here too.
          #
          # The C dependencies this adds are NOT new: ferrosa-memory-mcp, which
          # this job already builds for musl today, pulls the same
          # ring 0.17.14 and aws-lc-sys 0.40.0, and openssl-sys arrives through
          # ferrosa-memory-core and scylla for both. So the musl C toolchain
          # this needs is the one already in use. What webrtc-transport adds on
          # top is the pure-Rust webrtc-rs ICE/DTLS/SCTP stack, and
          # control_session.rs carries no platform gates at all.
          cargo build --release --target x86_64-unknown-linux-musl -p ferrosa-memory-sync \
            --features webrtc-transport
          strip target/x86_64-unknown-linux-musl/release/ferrosa-memory
          strip target/x86_64-unknown-linux-musl/release/ferrosa-memory-mcp
          strip target/x86_64-unknown-linux-musl/release/fmem
          strip target/x86_64-unknown-linux-musl/release/memory-sync
          file target/x86_64-unknown-linux-musl/release/ferrosa-memory
          file target/x86_64-unknown-linux-musl/release/ferrosa-memory-mcp

      - name: Stage tarball
        run: |
          bash .github/scripts/stage-release-tarball.sh \
            x86_64-unknown-linux-musl \
            target/x86_64-unknown-linux-musl/release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball-x86_64-unknown-linux-musl
          path: dist/*.tar.gz
          if-no-files-found: error

  # ── Container image (GHCR) ───────────────────────────────────────────
  # Builds and pushes a runtime container image from the x86_64 musl static
  # binary artifact so deployable images come from the release process, not
  # hand-built. Independent of the `release` job — it must not block the
  # GitHub release. Uses only already-pinned actions + shell `docker` so the
  # actions-pin-guard stays green (no new action pins introduced).
  build-image:
    name: Build & push container image
    needs: build-linux-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download x86_64 musl tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball-x86_64-unknown-linux-musl
          path: dist

      - name: Extract binaries and write runtime Dockerfile
        run: |
          mkdir -p build
          tar -xzf dist/*.tar.gz -C build/
          chmod 755 build/ferrosa-memory build/ferrosa-memory-mcp
          cat > build/Dockerfile <<'DOCKERFILE'
          FROM debian:trixie-slim
          RUN apt-get update \
              && apt-get install -y --no-install-recommends ca-certificates curl openssl \
              && rm -rf /var/lib/apt/lists/*
          COPY ferrosa-memory-mcp /usr/local/bin/ferrosa-memory-mcp
          COPY ferrosa-memory /usr/local/bin/ferrosa-memory
          EXPOSE 8765
          ENTRYPOINT ["ferrosa-memory-mcp"]
          DOCKERFILE

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        run: |
          OWNER="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/ferrosa-memory-mcp"
          docker build -t "${IMAGE}:${GITHUB_REF_NAME}" -t "${IMAGE}:latest" build/
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
          docker push "${IMAGE}:latest"

  # ── Linux aarch64 (musl, cross) ──────────────────────────────────────
  build-linux-aarch64:
    name: Build Linux aarch64 (musl, cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          toolchain: "1.98.0"   # keep in sync with rust-toolchain.toml
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: aarch64-musl

      - name: Install cross
        run: cargo install cross --locked --version 0.2.5

      - name: Clippy
        run: cross clippy --all-targets --target aarch64-unknown-linux-musl -- -D warnings

      - name: Build
        run: |
          cross build --release --target aarch64-unknown-linux-musl -p ferrosa-memory-mcp
          cross build --release --target aarch64-unknown-linux-musl -p fmem-cli
          cross build --release --target aarch64-unknown-linux-musl -p ferrosa-memory-sync \
            --features webrtc-transport
          if ! command -v aarch64-linux-gnu-strip >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
          fi
          aarch64-linux-gnu-strip target/aarch64-unknown-linux-musl/release/ferrosa-memory
          aarch64-linux-gnu-strip target/aarch64-unknown-linux-musl/release/ferrosa-memory-mcp
          aarch64-linux-gnu-strip target/aarch64-unknown-linux-musl/release/fmem
          aarch64-linux-gnu-strip target/aarch64-unknown-linux-musl/release/memory-sync

      - name: Stage tarball
        run: |
          bash .github/scripts/stage-release-tarball.sh \
            aarch64-unknown-linux-musl \
            target/aarch64-unknown-linux-musl/release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball-aarch64-unknown-linux-musl
          path: dist/*.tar.gz
          if-no-files-found: error

  # ── macOS aarch64 (Apple Silicon) ────────────────────────────────────
  build-macos-aarch64:
    name: Build macOS aarch64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
        with:
          toolchain: "1.98.0"   # keep in sync with rust-toolchain.toml
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --all-targets --target aarch64-apple-darwin -- -D warnings

      - name: Build
        run: |
          cargo build --release --target aarch64-apple-darwin -p ferrosa-memory-mcp
          # The enrolment CLI. `fmem login` is what writes the per-system device
          # key the control listener authenticates with, so a release without it
          # ships a listener nothing can enrol.
          cargo build --release --target aarch64-apple-darwin -p fmem-cli
          # The control listener.
          #
          # --features webrtc-transport is NOT optional. It is off by default,
          # and a memory-sync built without it has the right name, the right
          # size, and no `control-listen` subcommand at all -- so the binary
          # being present in a tarball is not evidence the release works. The
          # downstream installer checks for the subcommand rather than the file
          # for exactly this reason.
          cargo build --release --target aarch64-apple-darwin -p ferrosa-memory-sync \
            --features webrtc-transport
          strip target/aarch64-apple-darwin/release/ferrosa-memory
          strip target/aarch64-apple-darwin/release/ferrosa-memory-mcp
          strip target/aarch64-apple-darwin/release/fmem
          strip target/aarch64-apple-darwin/release/memory-sync

      - name: Stage tarball
        run: |
          bash .github/scripts/stage-release-tarball.sh \
            aarch64-apple-darwin \
            target/aarch64-apple-darwin/release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball-aarch64-apple-darwin
          path: dist/*.tar.gz
          if-no-files-found: error

  # ── Aggregate: SHA256SUMS + GitHub Release ───────────────────────────
  release:
    name: Create Release
    needs:
      - build-linux-x86_64
      - build-linux-aarch64
      - build-macos-aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Flatten artifacts into dist/
        run: |
          mkdir -p dist
          find artifacts -type f -name 'ferrosa-memory-*.tar.gz' \
            -exec cp -v {} dist/ \;
          ls -la dist/

      - name: Generate SHA256SUMS
        run: |
          cd dist
          (for f in $(ls ferrosa-memory-*.tar.gz | sort); do
             sha256sum "$f"
           done) > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Channel policy: every freshly built release is a prerelease (the
          # "nightly" channel). A release becomes "stable" only when a human
          # promotes it (promote-release.yml -> marks it --latest, not pre).
          # Tag-push events carry no input, so they default to prerelease too.
          PRERELEASE="${{ github.event.inputs.prerelease }}"
          if [ "${PRERELEASE}" = "false" ]; then
            REL_FLAGS=(--latest)
          else
            REL_FLAGS=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --title "Ferrosa Memory ${GITHUB_REF_NAME}" \
            --notes "Automated release. Verify SHA256SUMS before installing." \
            "${REL_FLAGS[@]}" \
            dist/ferrosa-memory-*.tar.gz dist/SHA256SUMS

      - name: Notify Homebrew tap (stable releases only)
        # Fire only for a stable publish (prerelease=false), and only AFTER the
        # release exists above — so the tap's /releases/latest resync sees it.
        if: ${{ github.event.inputs.prerelease == 'false' }}
        env:
          # Fine-grained PAT with contents:write on ferrosadb/homebrew-tap.
          # GITHUB_TOKEN cannot dispatch cross-repo. Absent => skip (hourly cron).
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping tap notify (hourly cron will sync)."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ferrosadb/homebrew-tap/dispatches \
            -d '{"event_type":"release-promoted"}'
          echo "Dispatched release-promoted to ferrosadb/homebrew-tap."
