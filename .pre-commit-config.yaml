repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ['--skip=Cargo.lock,target', '--ignore-words-list=wit,allEdges,crate,ser']

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false


      - id: cargo-clippy-prepush
        name: cargo clippy (pre-push, all-targets)
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-fmt-prepush
        name: cargo fmt --check (pre-push)
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: no-prod-loopback-prepush
        name: no hardcoded loopback CQL in prod source (p0-11 W-01)
        entry: ./.github/scripts/check-no-prod-loopback.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --lib --bins
        language: system
        pass_filenames: false
        stages: [pre-push]

  # The same check CI runs, run locally: a version that has drifted from its
  # tag is cheapest to notice before it is pushed. One script, two callers --
  # a second implementation is how the local rule and the gate come to
  # disagree about what "in step" means.
  - repo: local
    hooks:
      - id: version-sync
        name: workspace version matches the latest release tag
        entry: .github/scripts/check-version-sync.sh
        language: system
        pass_filenames: false
        # Only when the thing it reads actually changes.
        files: '^Cargo\.toml$'
