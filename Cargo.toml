[workspace]
members = ["crates/ferrosa-core", "crates/ferrosa-memory-mcp", "crates/ferrosa-memory-batch"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP client (embedding endpoint)
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Metrics
prometheus = "0.14"

# Hashing
sha2 = "0.10"

# UUIDs
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Config
dirs = "6"

# CQL driver (Ferrosa/Cassandra)
cdrs-tokio = { version = "9", features = ["derive"] }

# neo4rs removed — Ferrosa's Bolt is v5, neo4rs 0.8 only supports v4
# Graph queries go through Ferrosa's HTTP /graph/query endpoint via reqwest
