[workspace]
members = ["crates/ferrosa-memory-core", "crates/ferrosa-memory-mcp", "crates/ferrosa-memory-batch", "crates/ferrosa-memory-sync"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP client (embedding endpoint)
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Metrics
prometheus = "0.14"

# Hashing
sha1 = "0.10"
sha2 = "0.10"

# UUIDs
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Config
dirs = "6"

# CQL driver (Ferrosa/Cassandra) — using fork with VECTOR type support
# PR: https://github.com/krojew/cdrs-tokio/pull/221
cdrs-tokio = { git = "https://github.com/bkearns/cdrs-tokio.git", branch = "feature/vector-type", features = ["derive"] }

# TLS
tokio-rustls = "0.26"
rustls-pemfile = "2"

# WebSocket (viz dashboard)
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Ordered floats for Eq/Hash on f64
ordered-float = { version = "4", features = ["serde"] }

# Test helpers
tempfile = "3"

# neo4rs removed — Ferrosa's Bolt is v5, neo4rs 0.8 only supports v4
# Graph queries go through Ferrosa's HTTP /graph/query endpoint via reqwest
