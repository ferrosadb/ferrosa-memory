[workspace]
members = ["crates/fmem-cli", "crates/ferrosa-memory-core", "crates/ferrosa-memory-mcp", "crates/ferrosa-memory-batch", "crates/ferrosa-memory-sync", "crates/ferrosa-memory-eval"]
resolver = "2"

[workspace.package]
version = "0.29.2"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# HTTP client (embedding endpoint)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Diagnostics. rustls rather than native-tls so a musl build needs no OpenSSL,
# and default-features off so the SDK does not install its own panic handler
# behind our backs -- `panic` is opted into explicitly below.
sentry = { version = "0.49", default-features = false, features = [
    "backtrace", "contexts", "panic", "reqwest", "rustls",
] }
sentry-tracing = "0.49"
tracing-appender = "0.2"

# Metrics
prometheus = "0.14"

# Hashing
sha1 = "0.11"
sha2 = "0.11"

# Remote-memory signing (Ed25519 envelopes for teaching packets)
ed25519-dalek = { version = "3", features = ["rand_core"] }
# MAAS-T-36 peer session: signed-ephemeral X25519 DH derives the per-session
# pack IKM; static_secrets lets us feed locally generated random bytes without
# rand_core version coupling.
x25519-dalek = { version = "3", features = ["static_secrets"] }
rand_core = { version = "0.10", features = ["getrandom"] }

# MaaS P2P transfer crypto (ferrosa-memory-sync). RustCrypto 0.10/0.12
# generation — internally consistent AEAD + KDF stack (aead 0.5, digest 0.10).
# Kept distinct from the workspace `sha2 = "0.11"` above (used by content
# hashing elsewhere); the AEAD stack must use its own self-consistent digest.
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2_kdf = { package = "sha2", version = "0.10" }
aead = { version = "0.5", features = ["alloc"] }
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"

# MaaS P2P WebRTC transport (ferrosa-memory-sync, behind the `webrtc-transport`
# feature so non-P2P builds don't pull the ICE/DTLS/SCTP/SRTP tree). Provides
# the concrete RTCDataChannel that backs peer_transport::DataChannel (MAAS-T-25b).
# Held at 0.17 deliberately. 0.20 restructured the crate into a thin async
# layer over a Sans-I/O `rtc` core: webrtc::api, webrtc::interceptor and
# webrtc::ice_transport are gone, APIBuilder became PeerConnectionBuilder, and
# every on_*() callback became a PeerConnectionEventHandler method. That is a
# port of the P2P event model, not an upgrade. See .github/dependabot.yml.
webrtc = "0.17"
bytes = "1"
# digest 0.11 changed finalize() output to hybrid_array::Array, which doesn't
# implement LowerHex — encode digests via hex::encode instead of "{:x}".
hex = "0.4"

# UUIDs
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Config
dirs = "6"

# CQL driver (Ferrosa/Cassandra) — canonical ScyllaDB Rust driver (p1-22).
# Replaces an earlier cdrs-tokio fork on the feature/vector-type branch.
# The fork existed only for VECTOR type support; scylla 0.15 supports bytes/blob
# round-trips which we use for vector embedding storage (encode_vector/decode_vector).
scylla = { version = "0.15", features = ["chrono-04", "ssl"] }
# TLS for the CQL client; must track scylla's `ssl` feature (openssl 0.10).
# `vendored` makes openssl-sys compile its own OpenSSL from source, removing
# the system-library dependency that broke musl cross-compile in CI (the musl
# build targets don't have libssl-dev / a musl-compatible openssl.pc available).
# This works identically for x86_64-musl, aarch64-musl (cross), and macOS.
openssl = { version = "0.10", features = ["vendored"] }

# TLS
tokio-rustls = "0.26"
rustls-pemfile = "2"

# WebSocket (viz dashboard)
tokio-tungstenite = "0.30"
futures-util = "0.3"

# Ordered floats for Eq/Hash on f64
ordered-float = { version = "5", features = ["serde"] }

# Test helpers
tempfile = "3"

# neo4rs removed — Ferrosa's Bolt is v5, neo4rs 0.8 only supports v4
# Graph queries go through Ferrosa's HTTP /graph/query endpoint via reqwest

# Fork of scylla-rust-driver carrying the Cassandra VectorType (CEP-30)
# custom-type deserialization fix. Upstream rejects vector-typed columns
# from Cassandra-compatible servers (ferrosa) with
# "Support for custom types is not yet implemented".
# Upstream PR: https://github.com/scylladb/scylla-rust-driver/pull/1624
[patch.crates-io]
scylla = { git = "https://github.com/ferrosadb/scylla-rust-driver", rev = "1b146bf1" }
scylla-cql = { git = "https://github.com/ferrosadb/scylla-rust-driver", rev = "1b146bf1" }
scylla-macros = { git = "https://github.com/ferrosadb/scylla-rust-driver", rev = "1b146bf1" }
