# ferrosa-memory-mcp — default configuration (single-node, localhost).
#
# Installed to ~/.ferrosa/config/ferrosa-memory.toml on first install.
# Read via the FERROSA_MEMORY_CONFIG environment variable (set by the
# launchd plist / systemd unit).
#
# Assumes a Ferrosa instance is running at localhost:9042 — the default
# from `curl -fsSL https://ferrosadb.com/install.sh | bash`. If your
# Ferrosa is elsewhere, adjust contact_points + bolt_uri + http_url.
#
# Auth: run local first-use installs as ferrosa_admin so writes keep working
# across ferrosa restarts even if GRANT persistence has not been provisioned.
# Rotate via `ferrosa-ctl auth set-password` on your Ferrosa node, then update
# the matching entries here.
#
# HTTP auth for a binary install is self-contained: the installer creates
# ~/.ferrosa/config/http-auth.toml with the same per-install tenant it writes
# below. When switching this config to HTTP, keep that auth file and run:
#   ~/.ferrosa/bin/ferrosa-memory provision-tenant \
#     --config ~/.ferrosa/config/ferrosa-memory.toml \
#     --auth-file ~/.ferrosa/config/http-auth.toml
# This preserves existing data, updates the auth principal mapping, and removes
# server.tenant_id because HTTP derives tenant identity from authentication.
# Source-checkout examples are separate: http-auth.toml matches this template's
# tenant, while http-auth-multi-tenant.toml requires data to be seeded or
# migrated for each principal.

[server]
transport = "stdio"          # "stdio" for Claude Code/Desktop, "http" for remote
# http_port = 8765           # only used in http mode
# request_timeout_seconds = 30 # increase for cold local judge/embedding model loads
# log_level = "info"
tenant_id = "00000000-0000-0000-0000-000000000001"

[ferrosa]
contact_points = ["localhost:9042"]
keyspace = "agent_memory"
# replication_factor = 1     # single-node default
# consistency = "ONE"
username = "ferrosa_admin"
password = "ferrosa_admin"
# Admin credentials are used only for schema migrations (CREATE KEYSPACE /
# CREATE TABLE / ALTER TABLE) on first start. The runtime session uses
# `username`/`password` above.
admin_username = "ferrosa_admin"
admin_password = "ferrosa_admin"

[memory]
# default_ttl_days = 7
# fold_ttl_days = 30
# archive_after_days = 30
# compression_threshold_tokens = 512
# confidence_gate = 0.7
# max_memo_results = 50

[retrieval]
# Default ranked results returned by retrieval tools when k/limit is omitted.
# Keep live agent defaults compact to control context size. Use the eval profile
# below when measuring BRIGHT-Pro/MemoryBench recall before context packing.
default_limit = 10

[embeddings]
provider = "ollama"
ollama_base_url = "http://127.0.0.1:11434"
model = "nomic-embed-text-v2-moe"
dimensions = 768

# Graph / typed-edge backend (create_edge, explore_connections, etc.).
#
# IMPORTANT: these endpoints are served by Ferrosa's GRAPH ENGINE, which is a
# SEPARATE subsystem from the CQL/storage engine and must be enabled on the
# Ferrosa side too — having CQL up on 19042 does NOT mean the graph engine is
# running. If Ferrosa's graph engine is off (nothing listening on 7687/7474),
# edge tools fail; the MCP reports the engine as unreachable rather than a
# schema error, so you don't waste time chasing typed_edges DDL. Enable the
# graph engine in Ferrosa's own config, then point bolt_uri/http_url here at it.
[graph]
bolt_uri = "bolt://localhost:7687"   # Bolt protocol endpoint (Ferrosa graph engine)
username = "ferrosa_admin"
password = "ferrosa_admin"
http_url = "http://localhost:7474"   # HTTP health/transaction endpoint

[sparql]
enabled = true
# Omit http_url to use the built-in Ferrosa SPARQL listener default.
# Set it only when the Ferrosa listener bind is overridden.

[security]
# audit_log_enabled = true
# anomaly_detection_enabled = true
# anomaly_sigma_threshold = 3.0
# anomaly_alerts_enabled = true    # emit AnomalyDetected events via EventBus/SSE

[routing]
# guideline_version = "v1"
# feedback_export_cron = "0 2 * * *"

[eval]
# Ranked retrieval depth used by BRIGHT-Pro/MemoryBench fixture scoring.
retrieval_k = 25
# Current best-known BRIGHT-Pro support-doc-closed MCP slice profile:
#   candidate_limit=50
#   fusion_profile="all"
#   query_decomposition="llm"
#   query_task="bright_pro"
#   query_variant_limit=5
#   query_embed_variants=true
#   chunk_expansion="none"
#   rerank=false
# This measured alpha_nDCG=0.816, NDCG=0.799, aspect_recall=0.940,
# and recall=0.796 on the 200-doc biology support-closed slice.
# Optional LLM-as-judge / synthetic-conversation provider. The eval harness
# supports "mock" for CI, "ollama", "ollama.com", "lmstudio", and
# "openai_compatible". Tokens are read from the named environment variable
# instead of being stored in this file.
judge_enabled = false
judge_provider = "ollama"
judge_url = "http://127.0.0.1:11434"
judge_model = "qwen2.5-coder:7b"
# judge_token_env = "FMEM_JUDGE_TOKEN"
judge_timeout_seconds = 60
judge_temperature = 0.0

[judge]
# Live LLM reranker used by hybrid_search. Defaults to on for local installs
# with Ollama qwen2.5-coder:7b available. On CI/offline hosts, set
# enabled=false; if the model call fails, hybrid_search still falls back to
# normal hybrid fusion order and reports the skipped rerank in diagnostics.
enabled = true
provider = "ollama"
base_url = "http://127.0.0.1:11434"
model = "qwen2.5-coder:7b"
# token = ""
timeout_seconds = 60

[datalog]
# ferrosa-memory owns Datalog evaluation locally; this section controls local inference limits.
# max_iterations = 8
# max_facts = 10000
# cache_ttl_seconds = 300
