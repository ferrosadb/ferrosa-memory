[package]
name = "ferrosa-memory-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
mock-storage = []
long-running-operation-fixture = []
subscription-fixture = []
# p1-22: enable after cdrs-tokio → scylla migration to unlock T-01 and T-08
# tests that call scylla::Session::query_unpaged directly.
scylla-driver = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
# A real dependency, not dev-only: telemetry::init builds the subscriber
# the three binaries share, so they cannot drift into three of them.
tracing-subscriber = { workspace = true }
sentry = { workspace = true }
sentry-tracing = { workspace = true }
tracing-appender = { workspace = true }
prometheus = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
scylla = { workspace = true }
openssl = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
ordered-float = { workspace = true }
tempfile = { workspace = true }
nom = "8"
nom-supreme = "0.8"
base64 = "0.23"

# Integration tests under `tests/` compile against the public crate
# surface, which means `mod mock` must be gated on a feature (not
# `cfg(test)` alone). Turning `mock-storage` on for our own dev tests
# keeps the gate in place for downstream consumers.
[dev-dependencies]
ferrosa-memory-core = { path = ".", features = ["mock-storage", "scylla-driver"] }
tracing-subscriber = { workspace = true }
serial_test = "4.0"
# Property/fuzz testing of config parsing + validation (config-robustness
# initiative). Matches the version used in ferrosa-memory-sync.
proptest = "1"
# Self-signed cert generation for HTTPS integration tests — the
# bug-http-parser-rejects-split-send spec's acceptance criterion
# is a Python http.client POST over HTTPS, so we need a throwaway
# cert to exercise the TLS path end-to-end.
rcgen = "0.14"
