[package]
name = "ferrosa-memory-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fix-edge-sessions"
path = "src/tools/fix_edge_sessions.rs"

[[bin]]
name = "migrate"
path = "src/tools/migrate.rs"

[[bin]]
name = "ferrosa-memory"
path = "src/tools/ferrosa_memory.rs"

[[bin]]
name = "reconcile-dangling-edges"
path = "src/tools/reconcile_dangling_edges.rs"

[features]
long-running-operation-fixture = ["ferrosa-memory-core/long-running-operation-fixture"]
subscription-fixture = ["ferrosa-memory-core/subscription-fixture"]

[dependencies]
ferrosa-memory-core = { path = "../ferrosa-memory-core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
scylla = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
