[package]
name = "ferrosa-memory-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Terminal output is raw bytes — escape sequences, and whatever encoding the
# program chose. JSON strings cannot carry that, and lossy UTF-8 conversion
# would corrupt exactly the control sequences the emulator needs.
base64 = "0.23"
ferrosa-memory-core = { path = "../ferrosa-memory-core" }
# For the SessionExtension seam: a dyn-compatible async trait. Already in the
# tree via webrtc; this makes the dependency an explicit one.
async-trait = "0.1"
# A PTY, not piped stdio. Programs line-buffer and emit progress only when they
# believe they are on a terminal; piped output arrives in 8 KiB lumps minutes
# apart, which in an interactive session is indistinguishable from a hang.
portable-pty = "0.9"
scylla = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
prometheus = { workspace = true }

# MaaS P2P transfer crypto (T-33). See workspace deps for version rationale.
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2_kdf = { workspace = true }
aead = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }

# MaaS P2P WebRTC transport (MAAS-T-25b). Optional — only the concrete
# RTCDataChannel binding needs it; the transport core is dependency-free.
webrtc = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
# MAAS-T-36 peer session: broker signaling client + signed-ephemeral DH IKM.
reqwest = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
# Explicit DTLS crypto-provider selection when the workspace feature graph
# contains both Ring and AWS-LC through independent clients.
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

[features]
# Pulls the webrtc-rs ICE/DTLS/SCTP/SRTP stack and enables the concrete
# `peer_transport::webrtc` channel. Off by default to keep non-P2P builds light.
webrtc-transport = ["dep:webrtc", "dep:bytes", "dep:reqwest", "dep:x25519-dalek", "dep:rustls"]

[lib]
name = "ferrosa_memory_sync"
path = "src/lib.rs"

[[bin]]
name = "memory-sync"
path = "src/main.rs"

[dev-dependencies]
proptest = "1"
tempfile = { workspace = true }
# `test-util` gives the paused clock. The peer-loss tests turn on a ten-second
# grace period; without it they would take ten real seconds each and would be
# timing-dependent, which is the wrong way to test a timeout.
tokio = { workspace = true, features = ["test-util"] }
