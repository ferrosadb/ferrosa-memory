[package]
name = "ferrosa-memory-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferrosa-memory-core = { path = "../ferrosa-memory-core" }
scylla = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
prometheus = { workspace = true }

# MaaS P2P transfer crypto (T-33). See workspace deps for version rationale.
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2_kdf = { workspace = true }
aead = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }

# MaaS P2P WebRTC transport (MAAS-T-25b). Optional — only the concrete
# RTCDataChannel binding needs it; the transport core is dependency-free.
webrtc = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[features]
# Pulls the webrtc-rs ICE/DTLS/SCTP/SRTP stack and enables the concrete
# `peer_transport::webrtc` channel. Off by default to keep non-P2P builds light.
webrtc-transport = ["dep:webrtc", "dep:bytes"]

[lib]
name = "ferrosa_memory_sync"
path = "src/lib.rs"

[[bin]]
name = "memory-sync"
path = "src/main.rs"

[dev-dependencies]
proptest = "1"
# Loopback webrtc test installs a rustls CryptoProvider explicitly (rustls 0.23
# requires one when both ring and aws-lc-rs are in the tree).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
