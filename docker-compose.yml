# ferrosa-memory-mcp development cluster
# 3-node Ferrosa cluster + RustFS (S3) + Ollama (embeddings)
#
# Usage:
#   docker compose up -d
#   docker compose exec ollama ollama pull nomic-embed-text
#
# Ports:
#   19042-19044  CQL (node1-3)
#   17687-17689  Bolt/Cypher (node1-3)
#   17474-17476  Graph HTTP (node1-3)
#   19090-19092  Web console (node1-3)
#   19000-19001  RustFS S3 + console
#   11434        Ollama API

services:
  # --- S3-compatible object storage ---

  volume-permissions:
    image: alpine
    volumes:
      - ~/data/ferrosa-memory/rustfs:/data
    command: >
      sh -c "chown -R 10001:10001 /data && echo 'permissions fixed'"
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin  # pragma: allowlist secret
    volumes:
      - ~/data/ferrosa-memory/rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rustfs-init:
    image: minio/mc
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://rustfs:9000 rustfsadmin rustfsadmin &&
             mc mb local/ferrosa-memory --ignore-existing &&
             echo 'bucket created'"
    restart: "no"

  # --- 3-node Ferrosa cluster (CQL + Graph + Bolt) ---
  # Progressive join: node1=standalone, node2=pair, node3=cluster

  node1:
    image: ferrosa-memory-node
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "19042:9042"    # CQL
      - "17474:7474"    # Graph HTTP
      - "17687:7687"    # Bolt
      - "19090:9090"    # Web console
    environment:
      FERROSA_HOST_ID: "11111111-1111-1111-1111-111111111111"
      FERROSA_DATA_DIR: /var/lib/ferrosa
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_CQL_BIND: "0.0.0.0:9042"
      FERROSA_WEB_BIND: "0.0.0.0:9090"
      FERROSA_GRAPH_ENABLED: "true"
      FERROSA_CLUSTER_NAME: ferrosa-memory
      FERROSA_CLUSTER_MODE: standalone
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "node1:7000"
      FERROSA_S3_ENDPOINT: "http://rustfs:9000"
      FERROSA_S3_BUCKET: ferrosa-memory
      FERROSA_S3_REGION: us-east-1
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: rustfsadmin
      FERROSA_S3_SECRET_ACCESS_KEY: rustfsadmin  # pragma: allowlist secret
      FERROSA_S3_PREFIX: node1
    volumes:
      - ~/data/ferrosa-memory/node1:/var/lib/ferrosa
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9042' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  node2:
    image: ferrosa-memory-node
    depends_on:
      node1:
        condition: service_healthy
    ports:
      - "19043:9042"    # CQL
      - "17475:7474"    # Graph HTTP
      - "17688:7687"    # Bolt
      - "19091:9090"    # Web console
    environment:
      FERROSA_HOST_ID: "22222222-2222-2222-2222-222222222222"
      FERROSA_DATA_DIR: /var/lib/ferrosa
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_CQL_BIND: "0.0.0.0:9042"
      FERROSA_WEB_BIND: "0.0.0.0:9090"
      FERROSA_GRAPH_ENABLED: "true"
      FERROSA_CLUSTER_NAME: ferrosa-memory
      FERROSA_CLUSTER_MODE: pair
      FERROSA_SEED: "node1:7000"
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "node2:7000"
      FERROSA_S3_ENDPOINT: "http://rustfs:9000"
      FERROSA_S3_BUCKET: ferrosa-memory
      FERROSA_S3_REGION: us-east-1
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: rustfsadmin
      FERROSA_S3_SECRET_ACCESS_KEY: rustfsadmin  # pragma: allowlist secret
      FERROSA_S3_PREFIX: node2
    volumes:
      - ~/data/ferrosa-memory/node2:/var/lib/ferrosa
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9042' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  node3:
    image: ferrosa-memory-node
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
    ports:
      - "19044:9042"    # CQL
      - "17476:7474"    # Graph HTTP
      - "17689:7687"    # Bolt
      - "19092:9090"    # Web console
    environment:
      FERROSA_HOST_ID: "33333333-3333-3333-3333-333333333333"
      FERROSA_DATA_DIR: /var/lib/ferrosa
      FERROSA_AUTH_DISABLED: "true"
      FERROSA_CQL_BIND: "0.0.0.0:9042"
      FERROSA_WEB_BIND: "0.0.0.0:9090"
      FERROSA_GRAPH_ENABLED: "true"
      FERROSA_CLUSTER_NAME: ferrosa-memory
      FERROSA_CLUSTER_MODE: cluster
      FERROSA_SEED: "node1:7000"
      FERROSA_INTERNODE_BIND: "0.0.0.0:7000"
      FERROSA_INTERNODE_BROADCAST: "node3:7000"
      FERROSA_S3_ENDPOINT: "http://rustfs:9000"
      FERROSA_S3_BUCKET: ferrosa-memory
      FERROSA_S3_REGION: us-east-1
      FERROSA_S3_ALLOW_HTTP: "true"
      FERROSA_S3_ACCESS_KEY_ID: rustfsadmin
      FERROSA_S3_SECRET_ACCESS_KEY: rustfsadmin  # pragma: allowlist secret
      FERROSA_S3_PREFIX: node3
    volumes:
      - ~/data/ferrosa-memory/node3:/var/lib/ferrosa
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9042' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # --- Ollama embedding server ---

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ollama-data:
