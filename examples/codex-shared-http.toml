# Shared HTTPS MCP client config for Codex.
# Replace the host, credentials, and port for your deployment.
# The endpoint must include /mcp and use credentials that exist in
# examples/http-auth.toml (or your mounted auth file).
# The shared example's principal is ferrosa_user / ferrosa_user. Use
# http-auth-single-tenant.toml only when converting a local source checkout;
# replace this URL with the principal for the tenant whose data you need.

[mcp_servers.ferrosa-memory]
url = "https://ferrosa_user:ferrosa_user@memory.example.com:8765/mcp"

# Local TLS smoke-test variant:
# url = "https://ferrosa_user:ferrosa_user@localhost:8765/mcp"
