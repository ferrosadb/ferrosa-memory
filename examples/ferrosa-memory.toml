# Configuration for ferrosa-memory-mcp
# Matches the docker-compose.yml development cluster (run with: podman compose up -d)
# This file is for local stdio usage. For a shared HTTP endpoint, use
# `examples/ferrosa-memory-http.toml` plus `examples/http-auth.toml`.

[server]
transport = "stdio"          # "stdio" for Claude Code, "http" for remote
# http_port = 8765           # only used in http mode
# log_level = "info"
tenant_id = "00000000-0000-0000-0000-000000000001"

[ferrosa]
contact_points = ["localhost:19042", "localhost:19043", "localhost:19044"]
keyspace = "agent_memory"
# replication_factor = 3
# consistency = "LOCAL_QUORUM"
username = "ferrosa_user"
password = "ferrosa_user"
# Admin credentials used only for schema migrations (CREATE KEYSPACE /
# CREATE TABLE / ALTER TABLE). The runtime session still connects as
# `username`/`password` above; only the short-lived migration session
# uses these. Required on auth-enabled clusters where `ferrosa_user`
# lacks CREATE on the keyspace. Omit on auth-disabled dev clusters.
admin_username = "ferrosa_admin"
admin_password = "ferrosa_admin"

[memory]
# default_ttl_days = 7
# fold_ttl_days = 30
# archive_after_days = 30
# compression_threshold_tokens = 512
# confidence_gate = 0.7
# max_memo_results = 50

[retrieval]
# Default ranked results returned by retrieval tools when k/limit is omitted.
# Lower this if agent contexts become token-heavy; eval configs can use a higher k.
default_limit = 10

[embeddings]
provider = "ollama"
ollama_base_url = "http://127.0.0.1:11434"
model = "nomic-embed-text-v2-moe"
dimensions = 768

[graph]
bolt_uri = "bolt://localhost:17687"
username = "ferrosa_user"
password = "ferrosa_user"
http_url = "http://localhost:17474"

[sparql]
enabled = true
http_url = "http://localhost:18080"

[security]
# audit_log_enabled = true
# anomaly_detection_enabled = true
# anomaly_sigma_threshold = 3.0
# anomaly_alerts_enabled = true    # emit AnomalyDetected events via EventBus/SSE

[routing]
# guideline_version = "v1"
# feedback_export_cron = "0 2 * * *"

[eval]
# BRIGHT-Pro/MemoryBench fixture retrieval depth. Keep this higher than the
# normal MCP default so benchmark recall is measured before context packing.
retrieval_k = 25
# Best-known BRIGHT-Pro support-doc-closed MCP slice profile:
# candidate_limit=50, fusion_profile="all", query_decomposition="llm",
# query_task="bright_pro", query_variant_limit=5, query_embed_variants=true,
# chunk_expansion="none", rerank=false.

[datalog]
# ferrosa-memory owns Datalog evaluation locally; this section controls local inference limits.
# max_iterations = 8
# max_facts = 10000
# cache_ttl_seconds = 300
