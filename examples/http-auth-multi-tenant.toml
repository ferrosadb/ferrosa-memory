# File-backed HTTP auth database for a shared multi-tenant deployment.
# Passwords are lowercase SHA-256 hex digests of the cleartext password.
# Generate one with:
#   python3 - <<'PY'
#   import hashlib
#   print(hashlib.sha256(b"replace-me").hexdigest())
#   PY
#
# Each principal has a distinct tenant. These tenants are intentionally not the
# local single-user default: seed or migrate the data for each tenant before
# serving traffic. Do not replace a single-user install's auth file with this
# example when its existing data must remain visible.
# Seeded pairs are:
#   username=team_alpha / password=team_alpha
#   username=team_beta / password=team_beta
# Reload the file on a running server with: kill -HUP <pid>

[[principal]]
username = "team_alpha"
password_sha256 = "c6067b21b59f6d9b739840bf61a4732b45fbb6803692b6a3055d4f04b78f9ef8"
tenant_id = "11111111-1111-1111-1111-111111111111"

[[principal]]
username = "team_beta"
password_sha256 = "a04cc1c281fca9910471aa67d709edfae3bb4bf8e50ee1496a9f928717d834d1"
tenant_id = "22222222-2222-2222-2222-222222222222"
