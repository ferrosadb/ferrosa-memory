# File-backed HTTP auth database for a single-user HTTP deployment.
#
# This principal intentionally uses the tenant in
# config/ferrosa-memory.example.toml. Converting a source-checkout install from
# stdio to HTTP with this file therefore preserves first-run memory data.
# Binary installs provision ~/.ferrosa/config/http-auth.toml with a per-install
# tenant; keep that generated file rather than replacing it with this example.
# Passwords are lowercase SHA-256 hex digests of the cleartext password.
# Generate one with:
#   python3 - <<'PY'
#   import hashlib
#   print(hashlib.sha256(b"replace-me").hexdigest())
#   PY
# Seeded pair: username=ferrosa_user / password=ferrosa_user
# Reload the file on a running server with: kill -HUP <pid>

[[principal]]
username = "ferrosa_user"
password_sha256 = "13f073c47057958ae2bcee1b01a51469d147a5db1fa437aa934090b996285bde"
tenant_id = "00000000-0000-0000-0000-000000000001"
