# File-backed HTTP auth database for shared deployments.
# Passwords are lowercase SHA-256 hex digests of the cleartext password.
# Generate one with:
#   python3 - <<'PY'
#   import hashlib
#   print(hashlib.sha256(b"replace-me").hexdigest())
#   PY
# Seeded pairs are:
#   username=ferrosa_admin / password=ferrosa_admin
#   username=ferrosa_user / password=ferrosa_user
# Reload the file on a running server with: kill -HUP <pid>

