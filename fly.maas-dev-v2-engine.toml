app = "maas-dev-v2-engine"
primary_region = "lax"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Containerfile.fly"

[env]
  FERROSA_MEMORY_CONFIG = "/etc/ferrosa-memory/config.toml"
  RUST_LOG = "info"

[[files]]
  guest_path = "/etc/ferrosa-memory/config.toml"
  secret_name = "MEMORY_ENGINE_CONFIG_TOML" # pragma: allowlist secret

[[files]]
  guest_path = "/etc/ferrosa-memory/http-auth.toml"
  secret_name = "MEMORY_ENGINE_AUTH_TOML" # pragma: allowlist secret

[[files]]
  guest_path = "/etc/ferrosa-memory/tls.crt"
  secret_name = "MEMORY_ENGINE_TLS_CERT" # pragma: allowlist secret

[[files]]
  guest_path = "/etc/ferrosa-memory/tls.key"
  secret_name = "MEMORY_ENGINE_TLS_KEY" # pragma: allowlist secret

[[files]]
  guest_path = "/etc/ferrosa-memory/control-ca.pem"
  secret_name = "CONTROL_CLUSTER_CA_PEM" # pragma: allowlist secret

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
