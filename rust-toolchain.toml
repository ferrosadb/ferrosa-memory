# Pin the Rust toolchain so local builds match CI exactly.
#
# Without this, contributors build on whatever `rustc` they happen to have,
# and CI builds on `dtolnay/rust-toolchain` stable. That split is not
# hypothetical: type inference around array-literal/deref coercion changed in
# 1.95.0, so e.g. `with_label_values(&[&owned_string, "literal"])` fails to
# compile on 1.94.1 but builds clean on 1.95.0+. A contributor one release
# behind hit exactly that "fails locally, green in CI" trap.
#
# 1.98.0 is the current stable and is >= the 1.95.0 inference fix. rustup will
# auto-install this exact version on first `cargo` invocation, so an older
# default stable can't silently diverge. Bump this in lockstep with the CI
# toolchain (.github/workflows/ci.yml, dtolnay/rust-toolchain).
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy", "llvm-tools-preview"]
profile = "minimal"
